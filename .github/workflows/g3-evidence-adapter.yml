name: G3 evidence adapter

on:
  push:
    branches:
      - feat/lot-074-semantic-receipts
    paths:
      - scripts/build_g3_evidence.py
      - docs/G3_DIAGNOSTIC_REGISTRATION_2026-11-22.json
      - .github/workflows/g3-evidence-adapter.yml
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed LOT-055 diagnostic workflow run ID"
        required: true
        type: string
        default: "44996717511"

permissions:
  contents: read

concurrency:
  group: g3-evidence-adapter
  cancel-in-progress: false

jobs:
  build-diagnostic-evidence:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Checkout the exact frozen LOT-055 snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Be90nia/Lottery
          ref: fb33963442170bd212d039f3debd07bde58feac6
          path: snapshot-archive
          persist-credentials: false
      - name: Download the completed historical diagnostic artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: exact-subset-rolling-origin
          run-id: ${{ inputs.source_run_id || '44996717511' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source-run
      - name: Build six G3 evidence documents without promoting diagnostic results
        shell: bash
        run: |
          set -euo pipefail
          RUN_MANIFEST_SHA256="$(sha256sum source-run/run_manifest.json | cut -d' ' -f1)"
          python scripts/build_g3_evidence.py \
            --snapshot snapshot-archive/data/processed/draws-20261118.jsonl \
            --expected-snapshot-sha256 9f4cc51b76fd258dd056e0b86f675192d3d9a41c2901f771cab778c65ec2b6aa \
            --run-manifest source-run/run_manifest.json \
            --expected-run-manifest-sha256 "$RUN_MANIFEST_SHA256" \
            --ledger source-run/target-score-ledger.jsonl \
            --model-artifacts source-run/model-artifacts.jsonl \
            --registration docs/G3_DIAGNOSTIC_REGISTRATION_2026-11-22.json \
            --registry-root source-run/experiment-registry \
            --registry-run-receipt source-run/registry-run-receipt.json \
            --artifact-provenance source-run/model-artifact-provenance.jsonl \
            --durable-store-root source-run/durable-store \
            --storage-commit-receipts source-run/storage-commit-receipts.json \
            --output-dir g3-evidence
      - name: Upload G3 diagnostic evidence and explicit blockers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g3-diagnostic-evidence
          path: g3-evidence/
          retention-days: 90
