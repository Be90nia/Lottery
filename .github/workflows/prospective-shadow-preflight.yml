name: prospective-shadow-preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prospective-shadow-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run registry-bound schedule and evaluator tests
        run: |
          python -m unittest discover -s tests -p "test_prospective_registry.py" -v
          python -m unittest discover -s tests -p "test_prospective_evaluator.py" -v
          python -m unittest discover -s tests -p "test_prospective_runtime.py" -v
      - name: Enforce immutable Actions and least-privilege workflow policy
        run: python scripts/check_workflow_security.py
