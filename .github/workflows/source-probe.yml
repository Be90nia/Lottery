name: source-probe
# Read-only probe; a 567 response is recorded as BLOCKED, never bypassed.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Fetch one official page and preserve response
        id: fetch
        run: |
          set +e
          python scripts/fetch_history.py \
            --max-pages 1 \
            --delay 0 \
            --output data/interim/official_page1.jsonl \
            --raw-dir data/raw/official_probe > probe.log 2>&1
          status=$?
          cat probe.log
          if [ "$status" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP Error 567" probe.log; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Official API returned HTTP 567 from this runner; recorded as blocked."
          else
            exit "$status"
          fi
      - name: Reconcile overlap with legacy candidate
        if: steps.fetch.outputs.available == 'true'
        run: |
          python scripts/reconcile_candidate.py \
            data/candidates/legacy_draws.jsonl \
            data/interim/official_page1.jsonl
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: official-source-probe
          path: |
            probe.log
            data/interim/official_page1.jsonl
            data/raw/official_probe/
          if-no-files-found: warn
          retention-days: 14
