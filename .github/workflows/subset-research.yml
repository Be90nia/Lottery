name: exact-subset-research

on:
  # One-shot frozen research launch for the preregistered branch and the
  # explicit numerical-solver amendment branch. Never run on arbitrary pushes.
  push:
    branches:
      - feat/lot-055-preregistered-holm-inference
      - feat/lot-063-prospective-score-ledger
    paths:
      - .github/workflows/subset-research.yml
      - src/lottery/subset_model/artifact.py
      - src/lottery/subset_model/conditional_poisson.py
      - src/lottery/subset_model/exponential.py
      - src/lottery/subset_model/artifact.py
      - src/lottery/subset_model/rolling_origin_ledger.py
      - scripts/run_subset_rolling_origin.py
  workflow_dispatch:
    inputs:
      resume_checkpoints:
        description: "Restore checkpoints from the latest completed run only when evaluator source and frozen data are unchanged"
        type: boolean
        required: false
        default: true
permissions:
  contents: read

concurrency:
  group: exact-subset-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  full-rolling-origin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 360
    env:
      PYTHONPATH: src
      RUN_FULL_SUBSET_RESEARCH: "1"
      LOTTERY_WORKFLOW_ID: "423307604"
      RESEARCH_CODE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      RESEARCH_SNAPSHOT_COMMIT: fb33963442170bd212d039f3debd07bde58feac6
      RESEARCH_SNAPSHOT_TRUST_STATUS: manifest_complete_not_officially_authenticated
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Checkout the exact preregistered snapshot commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Be90nia/Lottery
          ref: fb33963442170bd212d039f3debd07bde58feac6
          path: snapshot-archive
          persist-credentials: false
      - name: Verify and stage frozen snapshot without changing its bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source = Path("snapshot-archive/data/processed/draws-20261118.jsonl")
          manifest_path = Path("snapshot-archive/data/processed/draws-20261118.jsonl.manifest.json")
          raw = source.read_bytes()
          expected = "9f4cc51b76fd258dd056e0b86f675192d3d9a41c2901f771cab778c65ec2b6aa"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit("pinned snapshot SHA-256 mismatch")
          if manifest.get("output_sha256") != expected or manifest.get("output_bytes") != len(raw):
              raise SystemExit("snapshot sidecar digest/byte count mismatch")
          if manifest.get("trust_status") != "manifest_complete_not_officially_authenticated":
              raise SystemExit("snapshot trust status changed; stop for preregistration review")
          if manifest.get("validation", {}).get("records") != 2949:
              raise SystemExit("snapshot manifest row count mismatch")
          destination = Path("data/processed/draws-20261118.jsonl")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(raw)
          print(f"Verified frozen snapshot: bytes={len(raw)} sha256={expected}")
          PY
      - name: Restore prior checkpoint when evaluator source is unchanged
        if: github.event_name != 'workflow_dispatch' || inputs.resume_checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          previous="$(gh run list --workflow subset-research.yml --branch "$branch" --limit 50 \
            --json databaseId,headSha,status \
            --jq 'map(select(.databaseId != (env.GITHUB_RUN_ID | tonumber) and .status == "completed")) | first // empty')"
          if [ -z "$previous" ]; then
            echo "No completed prior run; starting with empty checkpoints."
            exit 0
          fi
          previous_run="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["databaseId"])' "$previous")"
          previous_sha="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["headSha"])' "$previous")"
          gh auth setup-git
          git fetch --no-tags origin "$previous_sha" --depth=1
          if ! git diff --quiet "$previous_sha" "$RESEARCH_CODE_COMMIT" -- scripts/run_subset_rolling_origin.py src/lottery/subset_model src/lottery/backtest.py .github/workflows/subset-research.yml; then
            echo "Evaluator source changed since run $previous_run; refusing checkpoint reuse."
            exit 0
          fi
          mkdir -p previous-artifact
          if ! gh run download "$previous_run" --name exact-subset-rolling-origin --dir previous-artifact; then
            echo "Previous run has no downloadable artifact; starting fresh."
            exit 0
          fi
          if [ ! -d previous-artifact/subset-model-checkpoints ]; then
            echo "Previous artifact has no checkpoint directory; starting fresh."
            exit 0
          fi
          mkdir -p subset-model-checkpoints
          cp -a previous-artifact/subset-model-checkpoints/. subset-model-checkpoints/
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          files = sorted(Path("subset-model-checkpoints").glob("*.jsonl"))
          if not files:
              raise SystemExit("restored checkpoint directory is empty")
          current = os.environ["RESEARCH_CODE_COMMIT"]
          for path in files:
              lines = path.read_text(encoding="utf-8").splitlines()
              if not lines:
                  raise SystemExit(f"empty checkpoint: {path}")
              header = json.loads(lines[0])
              if header.get("schema") != "lot-055-checkpoint-v3":
                  raise SystemExit(f"unsupported checkpoint schema: {path}")
              header["code_commit"] = current
              lines[0] = json.dumps(header, sort_keys=True)
              temporary = path.with_name(path.name + ".tmp")
              temporary.write_text("\n".join(lines) + "\n", encoding="utf-8")
              temporary.replace(path)
          print(f"Restored {len(files)} checkpoint ledgers after confirming evaluator source identity.")
          PY
      - name: Run full frozen 2,649-target exact-subset evaluation
        run: |
          python scripts/run_subset_rolling_origin.py \
            --snapshot data/processed/draws-20261118.jsonl \
            --output subset-model-rolling-origin.json \
            --checkpoint-dir subset-model-checkpoints \
            --registry-root experiment-registry \
            --registration docs/G3_DIAGNOSTIC_REGISTRATION_2026-11-22.json \
            --require-execution-binding
      - name: Upload full research result (including failure diagnostics)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-subset-rolling-origin
          path: |
            subset-model-rolling-origin.json
            run_manifest.json
            target-score-ledger.jsonl
            model-artifacts.jsonl
            model-artifact-provenance.jsonl
            registry-run-receipt.json
            experiment-registry/
            experiment-storage/
            subset-model-checkpoints/
          if-no-files-found: warn
          retention-days: 90
