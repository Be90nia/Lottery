name: exact-subset-research

on:
  workflow_dispatch:
    inputs:
      resume_checkpoints:
        description: "Restore checkpoint ledgers from the latest completed run of this exact code revision"
        type: boolean
        required: false
        default: true
  pull_request:
    paths:
      - "scripts/run_subset_rolling_origin.py"
      - "src/lottery/subset_model/**"
      - ".github/workflows/subset-research.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: exact-subset-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  full-rolling-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: src
      RUN_FULL_SUBSET_RESEARCH: "1"
      RESEARCH_CODE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Restore prior checkpoint for the identical code revision
        if: github.event_name != 'workflow_dispatch' || inputs.resume_checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          previous_run="$(gh run list --workflow subset-research.yml --branch "$branch" --limit 50 \
            --json databaseId,headSha,status \
            --jq 'map(select(.databaseId != (env.GITHUB_RUN_ID | tonumber) and .headSha == env.RESEARCH_CODE_COMMIT and .status == "completed")) | first | .databaseId // empty')"
          if [ -z "$previous_run" ]; then
            echo "No completed run for this exact code revision; starting with an empty checkpoint."
            exit 0
          fi
          mkdir -p previous-artifact
          if gh run download "$previous_run" --name exact-subset-rolling-origin --dir previous-artifact; then
            if [ -d previous-artifact/subset-model-checkpoints ]; then
              mkdir -p subset-model-checkpoints
              cp -a previous-artifact/subset-model-checkpoints/. subset-model-checkpoints/
              echo "Restored checkpoint ledgers from run $previous_run."
            else
              echo "Previous artifact contained no checkpoint directory; starting fresh."
            fi
          else
            echo "Previous run had no downloadable artifact; starting fresh."
          fi
      - name: Run full frozen 2,649-target exact-subset evaluation
        run: |
          python scripts/run_subset_rolling_origin.py \
            --snapshot data/processed/draws-20261118.jsonl \
            --output subset-model-rolling-origin.json \
            --checkpoint-dir subset-model-checkpoints
      - name: Upload full research result (including failure diagnostics)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-subset-rolling-origin
          path: |
            subset-model-rolling-origin.json
            subset-model-checkpoints/
          if-no-files-found: warn
          retention-days: 90
