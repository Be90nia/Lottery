name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate imported legacy draw candidate
        run: python scripts/validate_dataset.py data/candidates/legacy_draws.jsonl
      - name: Audit imported legacy prize rows
        run: python scripts/validate_legacy_prizes.py
