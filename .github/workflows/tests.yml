name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  workflow-security-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Enforce immutable Actions and least-privilege permissions
        run: python scripts/check_workflow_security.py

  unit-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify cross-language JCS and RFC 8785 Appendix B vectors
        run: node tests/verify_jcs_golden.js
      - name: Validate imported legacy draw candidate
        run: python scripts/validate_dataset.py data/candidates/legacy_draws.jsonl
      - name: Verify official draw-order/equipment crosswalk sample
        run: |
          python scripts/verify_official_order_crosswalks.py \
            --candidate data/candidates/legacy_draws.jsonl \
            --crosswalks data/metadata_verification/official_order_crosswalks_20261118.json
      - name: Audit imported legacy prize rows
        run: python scripts/validate_legacy_prizes.py --output prize-reconciliation.json
      - name: Reconcile official snapshot prizes against legacy candidate
        run: |
          python scripts/reconcile_official_legacy_prizes.py \
            --official data/processed/prizes-20261118.jsonl \
            --legacy-glob data/candidates/legacy_prizes_part_*.jsonl \
            --output official-legacy-prize-reconciliation.json
      - name: Audit official awardType promotion draws against legacy flags
        run: |
          python scripts/audit_promotion_flags.py \
            --official data/processed/prizes-20261118.jsonl \
            --legacy-draws data/candidates/legacy_draws.jsonl \
            --output official-legacy-promotion-audit.json
      - name: Reconcile legacy candidate with independent CSV snapshot
        run: python scripts/reconcile_sources.py
      - name: Run legal-draw Monte Carlo baseline smoke test
        run: |
          python scripts/analyze_baseline.py data/candidates/legacy_draws.jsonl \
            --simulations 199 --seed 20261118 --output baseline-candidate.json
      - name: Run Holm-controlled pair co-occurrence diagnostic
        run: |
          python scripts/analyze_pairs.py data/candidates/legacy_draws.jsonl \
            --output pair-cooccurrence.json
      - name: Run deterministic chronological dataset split
        run: |
          python scripts/split_dataset.py data/candidates/legacy_draws.jsonl \
            --output-dir chronological-split
      - name: Run calendar-era diagnostic smoke test
        run: |
          python scripts/analyze_eras.py data/candidates/legacy_draws.jsonl \
            --simulations 99 --seed 20261118 --output era-diagnostic.json
      - name: Run leakage-safe rolling-origin benchmark
        run: |
          python scripts/backtest_models.py data/candidates/legacy_draws.jsonl \
            --min-train 300 --alpha 100 --half-life 100 \
            --output rolling-origin-benchmark.json
      - name: Run exploratory benchmark on official selected-number snapshot
        run: |
          python scripts/backtest_models.py data/processed/draws-20261118.jsonl \
            --min-train 300 --alpha 100 --half-life 100 \
            --output official-snapshot-rolling-origin-benchmark.json
      - name: Upload research reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lottery-research-reports
          path: |
            baseline-candidate.json
            era-diagnostic.json
            pair-cooccurrence.json
            chronological-split/
            rolling-origin-benchmark.json
            official-snapshot-rolling-origin-benchmark.json
            prize-reconciliation.json
            official-legacy-prize-reconciliation.json
            official-legacy-promotion-audit.json
          retention-days: 30

  windows-ledger-locks:
    runs-on: windows-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Test forecast and outcome ledger process locking
        run: |
          python -m unittest discover -s tests -p "test_forecast.py" -v
          python -m unittest discover -s tests -p "test_outcomes.py" -v
          python -m unittest discover -s tests -p "test_ledger_lock.py" -v
