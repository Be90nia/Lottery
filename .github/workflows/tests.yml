name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate imported legacy draw candidate
        run: python scripts/validate_dataset.py data/candidates/legacy_draws.jsonl
      - name: Audit imported legacy prize rows
        run: python scripts/validate_legacy_prizes.py
      - name: Reconcile legacy candidate with independent CSV snapshot
        run: python scripts/reconcile_sources.py
      - name: Run legal-draw Monte Carlo baseline smoke test
        run: |
          python scripts/analyze_baseline.py data/candidates/legacy_draws.jsonl \
            --simulations 199 --seed 20261118 --output baseline-candidate.json
      - name: Run Holm-controlled pair co-occurrence diagnostic
        run: |
          python scripts/analyze_pairs.py data/candidates/legacy_draws.jsonl \
            --output pair-cooccurrence.json
      - name: Run deterministic chronological dataset split
        run: |
          python scripts/split_dataset.py data/candidates/legacy_draws.jsonl \
            --output-dir chronological-split
      - name: Run calendar-era diagnostic smoke test
        run: |
          python scripts/analyze_eras.py data/candidates/legacy_draws.jsonl \
            --simulations 99 --seed 20261118 --output era-diagnostic.json
      - name: Run leakage-safe rolling-origin benchmark
        run: |
          python scripts/backtest_models.py data/candidates/legacy_draws.jsonl \
            --min-train 300 --alpha 100 --half-life 100 \
            --output rolling-origin-benchmark.json
      - name: Upload research reports
        uses: actions/upload-artifact@v4
        with:
          name: lottery-research-reports
          path: |
            baseline-candidate.json
            era-diagnostic.json
            pair-cooccurrence.json
            chronological-split/
            rolling-origin-benchmark.json
          retention-days: 30

  windows-ledger-locks:
    runs-on: windows-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test forecast and outcome ledger process locking
        run: |
          python -m unittest discover -s tests -p "test_forecast.py" -v
          python -m unittest discover -s tests -p "test_outcomes.py" -v
          python -m unittest discover -s tests -p "test_ledger_lock.py" -v
