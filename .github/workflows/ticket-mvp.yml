name: ticket-mvp-smoke

on:
  pull_request:
    paths:
      - "src/lottery/tickets.py"
      - "src/lottery/mvp.py"
      - "src/lottery/validate.py"
      - "scripts/generate_tickets.py"
      - "scripts/run_mvp.py"
      - "tests/test_mvp.py"
      - "tests/test_validate.py"
      - "docs/TICKET_MVP_BATCH_CONTRACT.md"
      - "data/candidates/pinned-draws-20261118.jsonl"
      - "data/candidates/pinned-draws-20261118.jsonl.manifest.json"
      - ".github/workflows/ticket-mvp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run the auditable MVP pipeline on the checked-in candidate history
        env:
          PYTHONPATH: src
        run: |
          python scripts/run_mvp.py --dataset data/candidates/pinned-draws-20261118.jsonl \
            --tickets-per-strategy 5 --seed 20261119 --output mvp-output.json
      - name: Verify complete 3-lane batch and provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          document = json.loads(Path("mvp-output.json").read_text(encoding="utf-8"))
          report = document["batch"]
          receipt = document["receipt"]
          assert receipt["status"] == "candidate_batch_generated"
          assert receipt["published_ticket_count"] == 15
          assert receipt["data_trust_status"] == "manifest_complete_not_officially_authenticated"
          assert len(receipt["dataset_manifest_sha256"]) == 64
          assert report["dataset"]["trust_status"] == "manifest_complete_not_officially_authenticated"
          assert len(report["dataset"]["manifest_sha256"]) == 64
          assert report["dataset"]["validation"]["records"] == 2949
          assert report["dataset"]["validation"]["last_draw"] == "26131"
          assert report["strategy_semantics"]["physical_ball_set_models"] == "not_implemented"
          assert report["strategy_semantics"]["predictive_efficacy_claim"] == "none"
          assert receipt["strategy_scope"] == "historical_marginal_sampling_heuristics_not_physical_ball_sets"
          assert receipt["predictive_efficacy_claim"] == "none"
          assert receipt["automatic_sync_status"] == "not_attempted"
          assert len(receipt["code_commit"]) == 40
          assert len(receipt["batch_sha256"]) == 64
          assert receipt["dataset_sha256"] == "9f4cc51b76fd258dd056e0b86f675192d3d9a41c2901f771cab778c65ec2b6aa"
          assert receipt["model_training_status"] == "not_performed"
          assert receipt["model_promotion_status"] == "not_performed" 
          lanes = report["strategies"]
          assert set(lanes) == {"uniform", "expanding", "ewma"}
          assert report["tickets_per_strategy"] == 5
          assert report["total_tickets"] == 15
          assert len(report["generation_run_id"]) == 64
          assert len(report["training_dataset_fingerprint"]) == 64
          ticket_ids = []
          for lane, tickets in lanes.items():
              assert len(tickets) == 5, lane
              assert report["strategy_metadata"][lane]["ticket_count"] == 5
              for ticket in tickets:
                  front, back = ticket["front_numbers"], ticket["back_numbers"]
                  assert len(front) == 5 and len(set(front)) == 5 and front == sorted(front)
                  assert all(type(n) is int and 1 <= n <= 35 for n in front)
                  assert len(back) == 2 and len(set(back)) == 2 and back == sorted(back)
                  assert all(type(n) is int and 1 <= n <= 12 for n in back)
                  ticket_ids.append(ticket["ticket_id"])
          assert len(ticket_ids) == 15 and len(set(ticket_ids)) == 15
          print("verified 15 legal tickets across 3 provenance lanes")
          PY
      - name: Upload candidate report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ticket-mvp-candidates
          path: mvp-output.json
          retention-days: 30
