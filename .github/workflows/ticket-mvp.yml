name: ticket-mvp-smoke

on:
  pull_request:
    paths:
      - "src/lottery/tickets.py"
      - "scripts/generate_tickets.py"
      - "data/candidates/legacy_draws.jsonl"
      - ".github/workflows/ticket-mvp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Generate reproducible candidate tickets from the checked-in history
        env:
          PYTHONPATH: src
        run: |
          python scripts/generate_tickets.py data/candidates/legacy_draws.jsonl \
            --tickets 5 --seed 20261119 --output ticket-candidates.json
      - name: Upload candidate report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ticket-mvp-candidates
          path: ticket-candidates.json
          retention-days: 30
