[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lottery-research"
version = "0.1.0"
description = "Reproducible Super Lotto data ingestion and statistical research"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6", "scipy==1.15.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
